<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keyword Panamá</title>
<style>
/* El mismo diseño de KeyCurul (Ecuador): la oficina ilustrada al centro (el equipo en sus escritorios y Kiwi en su
   oficina de vidrio), la conversación con Kiwi a la derecha y, debajo, lo que llegó día a día.
   Las pestañas van debajo de la barra de marca. Proyectos y Diputados son propias de Panamá. */
:root {
  --fondo: #eef0f2;
  --mancha-1: #d3e6e1;
  --mancha-2: #f2e0c8;
  --vidrio: rgb(255 255 255 / .66);
  --vidrio-fuerte: rgb(255 255 255 / .86);
  --borde: rgb(20 40 50 / .09);
  --brillo: rgb(255 255 255 / .8);
  --texto: #15212b;
  --texto-2: #5c6b75;
  --acento: #0a6cff;
  --sobre-acento: #ffffff;
  --burbuja: rgb(20 40 50 / .06);
  --alto: #e5484d; --medio: #f08c2b; --bajo: #d4b106; --ninguno: #9aa5ad;
  --ok: #1fa35b;
  --sombra: 0 1px 1px rgb(20 40 50 / .04), 0 10px 30px rgb(20 40 50 / .08);
  --radio: 22px;
  --fuente: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --fuente-titulo: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --muelle: cubic-bezier(.2, .9, .25, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fondo: #0e1317; --mancha-1: #12383a; --mancha-2: #3a2a16;
  --vidrio: rgb(30 38 44 / .6); --vidrio-fuerte: rgb(30 38 44 / .86); --borde: rgb(255 255 255 / .08); --brillo: rgb(255 255 255 / .12);
  --texto: #eef3f5; --texto-2: #9aa9b2; --acento: #3b8cff; --burbuja: rgb(255 255 255 / .08); --ok: #3ccf7e;
  --sombra: 0 1px 1px rgb(0 0 0 / .3), 0 12px 34px rgb(0 0 0 / .35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --fondo: #0e1317; --mancha-1: #12383a; --mancha-2: #3a2a16;
  --vidrio: rgb(30 38 44 / .6); --vidrio-fuerte: rgb(30 38 44 / .86); --borde: rgb(255 255 255 / .08); --brillo: rgb(255 255 255 / .12);
  --texto: #eef3f5; --texto-2: #9aa9b2; --acento: #3b8cff; --burbuja: rgb(255 255 255 / .08); --ok: #3ccf7e;
  --sombra: 0 1px 1px rgb(0 0 0 / .3), 0 12px 34px rgb(0 0 0 / .35); color-scheme: dark; }

* { box-sizing: border-box }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--fondo); color: var(--texto); font: 16px/1.5 var(--fuente); -webkit-font-smoothing: antialiased; padding-inline: 16px; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
  background: radial-gradient(40% 35% at 15% 15%, var(--mancha-1), transparent 70%), radial-gradient(35% 30% at 88% 80%, var(--mancha-2), transparent 70%); }
.marco { max-width: 1320px; margin: 0 auto; padding-block: 32px 56px; display: grid; gap: 28px; }
.vidrio { background: var(--vidrio); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%);
  border: 1px solid var(--borde); box-shadow: var(--sombra), inset 0 1px 0 var(--brillo); border-radius: var(--radio); }

/* barra de marca: logo de Keyword | nombre */
.marca img { display: block; height: clamp(26px, 2.6vw, 34px); width: auto; }
.marca .logo-para-oscuro { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .marca .logo-para-claro { display: none; }
  :root:not([data-theme="light"]) .marca .logo-para-oscuro { display: block; } }
:root[data-theme="dark"] .marca .logo-para-claro { display: none; }
:root[data-theme="dark"] .marca .logo-para-oscuro { display: block; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--texto-2); margin: 0 0 4px; font-variant-numeric: tabular-nums; }
header.barra { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 12px 14px 12px 20px; border-radius: 22px; }
.marca-grupo { display: flex; align-items: center; gap: 16px; min-width: 0; }
.separador { width: 1px; align-self: stretch; margin: 4px 0; background: var(--borde); }
.nombre-app { display: grid; gap: 1px; }
h1 { font: 700 clamp(22px, 2.2vw, 28px)/1.05 var(--fuente-titulo); letter-spacing: -.025em; margin: 0; }
.subtitulo { margin: 0; font-size: 13px; font-weight: 500; color: var(--texto-2); }
@media (max-width: 640px) { header.barra { padding: 12px; gap: 12px; } }
h2.seccion { font: 600 13px var(--fuente); letter-spacing: .04em; text-transform: uppercase; color: var(--texto-2); margin: 0 0 12px 4px; }

/* ---------- pestañas (debajo de la barra) */
.pestanas { display: none !important; }
.pestanas-viejas { position: relative; display: inline-flex; justify-self: start; gap: 2px; padding: 4px; border-radius: 14px; background: var(--burbuja); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.pestanas button { all: unset; position: relative; z-index: 1; cursor: pointer; white-space: nowrap; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 10px; color: var(--texto-2); transition: color .2s; }
.pestanas button[aria-selected="true"] { color: var(--texto); }
.pestanas button:active { transform: scale(.97); }
.pestanas button:focus-visible { outline: 2px solid var(--acento); }
.indicador { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 10px; background: var(--vidrio-fuerte); box-shadow: 0 1px 3px rgb(0 0 0 / .12);
  transition: transform .45s var(--muelle), width .45s var(--muelle); }
.cuenta { font-size: 11px; font-weight: 700; color: var(--texto-2); background: var(--burbuja); border-radius: 99px; padding: 1px 7px; margin-left: 4px; font-variant-numeric: tabular-nums; }
.cuenta:empty { display: none; }
.panel { display: grid; gap: 28px; }
.panel.entra { animation: materializa .4s var(--muelle); }
@keyframes materializa { from { opacity: 0; transform: translateY(6px); filter: blur(6px) } to { opacity: 1; transform: none; filter: none } }
@media (max-width: 640px) { .pestanas { width: 100%; } .pestanas button { flex: 1; text-align: center; padding: 8px 10px; } }

.piso { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 24px; align-items: stretch; }

/* ---------- la oficina ilustrada */
/* el dibujo se recorta con las esquinas redondeadas en su propia capa; la oficina no recorta, así las fichas de los
   agentes y los globos pueden sobresalir sin cortarse */
.oficina { position: relative; aspect-ratio: 1200 / 640; max-width: 100%; }
.lienzo { position: absolute; inset: 0; border-radius: 26px; overflow: hidden; box-shadow: var(--sombra); background: #e9e3da; }
.lienzo > svg.fondo { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.persona { position: absolute; transform: translate(-50%, -100%); cursor: help; outline: none; }
.persona:hover, .persona:focus-visible, .persona.tip-abierto { z-index: 1000 !important; }
.tip { position: absolute; left: 50%; bottom: 96%; transform: translate(-50%, 6px) scale(.96); width: max-content; max-width: min(280px, 72vw); white-space: normal; overflow-wrap: break-word;
  padding: 10px 12px; border-radius: 14px; background: rgb(255 255 255 / .94); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  box-shadow: 0 10px 28px rgb(0 0 0 / .18); color: #15212b; font-size: 12.5px; line-height: 1.4; text-align: left;
  opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .3s var(--muelle); }
.tip b { display: block; font-size: 14px; }
.tip .tip-rol { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: #5c6b75; margin: 1px 0 6px; }
.tip .tip-dato { display: block; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgb(20 40 50 / .1); color: #0a6cff; font-weight: 600; }
.tip .tip-dato:empty { display: none; }
.persona:hover .tip, .persona:focus-visible .tip, .persona.tip-abierto .tip { opacity: 1; transform: translate(-50%, 0) scale(1); }
.persona.tip-der .tip { left: auto; right: 0; transform: translate(0, 6px) scale(.96); transform-origin: 100% 100%; }
.persona.tip-der:hover .tip, .persona.tip-der:focus-visible .tip, .persona.tip-der.tip-abierto .tip { transform: translate(0, 0) scale(1); }
.persona.tip-izq .tip { left: 0; transform: translate(0, 6px) scale(.96); transform-origin: 0 100%; }
.persona.tip-izq:hover .tip, .persona.tip-izq:focus-visible .tip, .persona.tip-izq.tip-abierto .tip { transform: translate(0, 0) scale(1); }
.persona:focus-visible .placa { outline: 2px solid var(--acento); }
.persona svg { width: 100%; height: auto; display: block; overflow: visible; }
.trabajador { width: 15.83%; }
.jefe { width: 8.2%; will-change: left, top; }
.placa { position: absolute; left: 50%; bottom: -2%; transform: translate(-50%, 100%); font: 600 clamp(9px, .95vw, 12px)/1 var(--fuente); white-space: nowrap;
  color: #22303a; background: rgb(255 255 255 / .72); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid rgb(255 255 255 / .9);
  box-shadow: 0 2px 8px rgb(0 0 0 / .1); padding: 4px 8px; border-radius: 99px; display: flex; gap: 5px; align-items: center; }
.placa i { width: 6px; height: 6px; border-radius: 50%; background: #c7811f; }
.trabaja .placa i, .jefe .placa i { background: #1fa35b; }
.manos .mano { transform-box: fill-box; transform-origin: center; }
.trabaja .mano { animation: teclea .28s ease-in-out infinite alternate; }
.trabaja .mano.md { animation-delay: .14s; }
@keyframes teclea { to { transform: translateY(-3px); } }
.luz-pantalla { opacity: 0; transition: opacity .6s; }
.trabaja .luz-pantalla { opacity: 1; }
.pierna { transform-box: fill-box; transform-origin: 50% 0; }
.caminando .pierna.pi { animation: paso .42s ease-in-out infinite alternate; }
.caminando .pierna.pd { animation: paso .42s ease-in-out infinite alternate-reverse; }
.caminando .cuerpo-kiwi { animation: rebote .42s ease-in-out infinite alternate; }
@keyframes rebote { from { transform: translateY(0) rotate(-2deg); } to { transform: translateY(-4px) rotate(2deg); } }
.cuerpo-kiwi { transform-box: fill-box; transform-origin: 50% 100%; }
.ojos-kiwi { animation: mira 7s ease-in-out infinite; }
@keyframes mira { 0%, 40%, 100% { transform: translateX(0) } 50%, 70% { transform: translateX(-2px) } }
@keyframes paso { from { transform: rotate(-13deg); } to { transform: rotate(13deg); } }
.globo { position: absolute; transform: translate(-50%, -100%); max-width: 30%; overflow-wrap: break-word; font-size: clamp(10px, 1vw, 13px); line-height: 1.35; color: #15212b;
  background: rgb(255 255 255 / .92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding: 7px 10px; border-radius: 14px;
  box-shadow: 0 6px 18px rgb(0 0 0 / .14); pointer-events: none; z-index: 900; transform-origin: 50% 100%; animation: globo .35s var(--muelle); }
.globo::after { content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); border: 6px solid transparent; border-bottom: 0; border-top-color: rgb(255 255 255 / .92); }
.globo.escribe { display: inline-flex; gap: 4px; padding: 10px 12px; }
.globo.escribe i { width: 6px; height: 6px; border-radius: 50%; background: #5c6b75; animation: salto 1.1s ease-in-out infinite; }
.globo.escribe i:nth-child(2) { animation-delay: .15s } .globo.escribe i:nth-child(3) { animation-delay: .3s }
@keyframes globo { from { opacity: 0; transform: translate(-50%, -92%) scale(.85); } to { opacity: 1; transform: translate(-50%, -100%) scale(1); } }
@keyframes salto { 0%, 60%, 100% { transform: translateY(0); opacity: .4 } 30% { transform: translateY(-3px); opacity: 1 } }
.pizarra { position: absolute; top: 3.75%; width: 25.5%; height: 26.9%; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 12px; z-index: 50; }
.pizarra:hover { box-shadow: 0 0 0 3px rgb(10 108 255 / .35); }
.pizarra:active { transform: scale(.98); }
.pizarra:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
.cuadro-hemiciclo { position: absolute; left: 85%; top: 10.9%; width: 12.5%; height: 18.4%; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 10px; z-index: 50; }
.cuadro-hemiciclo:hover { box-shadow: 0 0 0 3px rgb(10 108 255 / .35); }
.cuadro-hemiciclo:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

/* ---------- conversación con Kiwi */
/* el chat toma el alto de la escena: contain: size hace que su contenido no estire la fila */
.charla { display: flex; flex-direction: column; contain: size; min-height: 420px; min-width: 0; overflow: hidden; }
.charla-cabeza { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--borde); }
.mini { display: block; flex: none; width: 44px; height: 44px; border-radius: 50%; overflow: hidden; }
.mini svg { width: 100%; height: 100%; display: block; }
.charla-cabeza h2 { font: 600 17px/1.2 var(--fuente-titulo); margin: 0; letter-spacing: -.01em; }
.charla-cabeza p { margin: 0; font-size: 13px; color: var(--texto-2); }
.borrar-chat { all: unset; cursor: pointer; margin-left: auto; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 99px; background: var(--burbuja); color: var(--texto-2); }
.borrar-chat:hover { color: var(--texto); }
.borrar-chat:focus-visible { outline: 2px solid var(--acento); }
.mensajes { flex: 1; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 14px); mask-image: linear-gradient(to bottom, transparent, #000 14px); }
.msj { max-width: 86%; padding: 9px 13px; border-radius: 19px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; line-height: 1.42;
  animation: burbuja .35s var(--muelle); transform-origin: bottom left; }
.msj.jefe-dice { background: var(--burbuja); align-self: flex-start; border-bottom-left-radius: 6px; }
.msj.yo-digo { background: var(--acento); color: var(--sobre-acento); align-self: flex-end; border-bottom-right-radius: 6px; transform-origin: bottom right; }
.msj.error { box-shadow: inset 0 0 0 1px var(--medio); }
.msj.pensando { display: inline-flex; gap: 4px; padding: 13px 14px; }
.msj.pensando i { width: 7px; height: 7px; border-radius: 50%; background: var(--texto-2); animation: salto 1.1s ease-in-out infinite; }
.msj.pensando i:nth-child(2) { animation-delay: .15s } .msj.pensando i:nth-child(3) { animation-delay: .3s }
.nota { align-self: center; font-size: 12px; color: var(--texto-2); padding: 2px 0; text-align: center; }
@keyframes burbuja { from { opacity: 0; transform: scale(.9) } to { opacity: 1; transform: none } }
.sugerencias { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 16px 10px; }
.sugerencias button { all: unset; cursor: pointer; white-space: nowrap; font-size: 12.5px; padding: 6px 11px; border-radius: 99px; background: var(--burbuja); color: var(--texto); transition: transform .1s ease-out; }
.sugerencias button:active { transform: scale(.95); }
.sugerencias button:focus-visible { outline: 2px solid var(--acento); }
.opciones { display: grid; gap: 6px; margin-top: 10px; white-space: normal; }
.opciones button { all: unset; cursor: pointer; font-size: 13px; line-height: 1.35; padding: 8px 12px; border-radius: 12px; background: var(--fondo); border: 1px solid rgba(127,127,127,.25); transition: transform .1s ease-out; }
.opciones button b { font-weight: 700; margin-right: 4px; }
.opciones button:active { transform: scale(.98); }
.opciones button:focus-visible { outline: 2px solid var(--acento); }
.charla form { display: flex; gap: 8px; align-items: center; padding: 10px 12px 14px; border-top: 1px solid var(--borde); }
.charla form input { flex: 1; min-width: 0; font: 15px var(--fuente); color: var(--texto); background: var(--burbuja); border: 1px solid transparent; border-radius: 99px; padding: 10px 16px; }
.charla form input:focus { outline: none; border-color: var(--acento); }
.charla form button { all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--acento); color: var(--sobre-acento); flex: none; transition: transform .1s ease-out; }
.charla form button:active { transform: scale(.9); }
.charla form button:disabled { opacity: .45; cursor: default; }
.charla form button:focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; }

/* ---------- oficina: últimas actualizaciones, un día a la vez */
@media (max-width: 1060px) {
  .piso { grid-template-columns: minmax(0, 1fr); }
  .escena { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding-top: 6px; background: var(--fondo); }
  .charla { height: 70vh; height: 70dvh; }
}
@media (max-width: 640px) { .placa { display: none; } .globo { max-width: 44%; } }
@media (max-width: 760px) { .escena { position: static; padding-top: 0; } }

/* ---------- la oficina de un solo piso: cada agente está a cargo de un proceso; al tocarlo se abre su mesa */
.persona.trabajador { cursor: pointer; }
.persona.apagado svg { filter: grayscale(1); opacity: .55; }
.persona.apagado { cursor: help; }
.persona.apagado .placa i { background: #a3a3ad; }
.persona .aviso-num { position: absolute; top: 4%; right: 18%; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: #e5484d;
  color: #fff; font: 700 12px/22px var(--fuente); text-align: center; box-shadow: 0 2px 6px rgb(0 0 0 / .2); }
.persona .aviso-num:empty { display: none; }
.estado-mac { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--texto-2); padding: 8px 14px; border-radius: 99px; background: var(--burbuja); }
.punto { width: 9px; height: 9px; border-radius: 50%; background: #a3a3ad; flex: none; display: inline-block; }
.punto.vivo { background: #1fa35b; box-shadow: 0 0 0 4px rgb(31 163 91 / .18); }
.punto.rojo { background: #e5484d; box-shadow: 0 0 0 4px rgb(229 72 77 / .2); animation: latir 1.6s infinite; }
@keyframes latir { 50% { box-shadow: 0 0 0 8px rgb(229 72 77 / 0); } }

/* debajo de la escena: agenda de la Asamblea (legal) y agenda de medios de las autoridades (política) */
.semana { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
.dia { padding: 14px; }
.dia h3 { font: 700 15px/1.2 var(--fuente-titulo); margin: 0 0 4px; }
.dia h3 small { font-weight: 600; color: var(--texto-2); margin-left: 6px; }
.sesion-c { border-radius: 14px; background: var(--burbuja); padding: 10px 12px; margin-top: 8px; font-size: 13px; }
.sesion-c b { display: block; font-size: 13.5px; }
.sesion-c .hora { font-weight: 700; color: var(--acento); font-size: 12px; }
.sesion-c p { margin: 4px 0 0; color: var(--texto-2); font-size: 12.5px; line-height: 1.4; }
.sesion-c.pleno { background: #2c3e57; color: #fff; }
.sesion-c.pleno p, .sesion-c.pleno .hora { color: #cfe0ff; }
.sesion-c .decision { justify-content: flex-start; margin-top: 8px; }
.sesion-c .decision .boton { font-size: 12px; padding: 5px 10px; }
.autoridades { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.autoridad { all: unset; box-sizing: border-box; cursor: pointer; padding: 16px 12px; text-align: center; display: grid; justify-items: center; gap: 4px; transition: transform .15s var(--muelle); }
.autoridad:hover { transform: translateY(-2px); }
.autoridad:focus-visible { outline: 2px solid var(--acento); }
.autoridad .foto { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font: 600 24px var(--fuente-titulo); color: #fff; margin-bottom: 6px; }
.autoridad .foto img { width: 100%; height: 100%; object-fit: cover; }
.autoridad b { font-size: 14px; line-height: 1.25; }
.autoridad span { font-size: 12px; color: var(--texto-2); line-height: 1.3; }
.autoridad i { font-style: normal; font-size: 11px; font-weight: 700; color: var(--acento); margin-top: 4px; }

/* un solo piso que se recorre: arrastrar con el mouse, deslizar o los botones de arriba */
.recorrido { overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; border-radius: 26px; box-shadow: var(--sombra); cursor: grab;
  scrollbar-width: none; overscroll-behavior-x: contain; }
.recorrido::-webkit-scrollbar { display: none; }
.recorrido.arrastrando { scroll-snap-type: none; cursor: grabbing; user-select: none; }
.recorrido .oficina { width: 300%; max-width: none; aspect-ratio: 3600 / 640; }
.recorrido .lienzo { border-radius: 0; box-shadow: none; }
.parada { position: absolute; top: 0; width: 33.3333%; height: 1px; scroll-snap-align: start; pointer-events: none; }
.trabajador { width: 5.2767% !important; }
.trabajador.chico { width: 3.9% !important; }
.pizarra { left: 12.83%; top: 6.25%; width: 11.22%; height: 31.25%; }
.boton-hemiciclo { position: absolute; left: 28.33%; top: 10.9%; width: 4.17%; height: 18.4%; border: 0; padding: 0; background: transparent; cursor: pointer; border-radius: 10px; z-index: 50; }
.boton-hemiciclo:hover { box-shadow: 0 0 0 3px rgb(10 108 255 / .35); }
.boton-hemiciclo:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
/* agenda día a día (como la de Ecuador) */
.cal-nav { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 18px; margin-bottom: 12px; }
.cal-fecha { flex: 1; min-width: 0; text-align: center; display: grid; padding: 2px 8px; }
.cal-fecha small { font-size: 12px; font-weight: 600; color: var(--acento); }
.cal-fecha b { font: 700 clamp(17px, 2vw, 21px)/1.2 var(--fuente-titulo); letter-spacing: -.015em; }
.cal-flecha { all: unset; cursor: pointer; flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; line-height: 1; background: var(--burbuja); color: var(--texto); }
.cal-flecha:disabled { opacity: .35; cursor: default; }
.cal-hoy { all: unset; cursor: pointer; flex: none; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: 99px; background: var(--acento); color: var(--sobre-acento); }
.cal-hoy:disabled { background: var(--burbuja); color: var(--texto-2); cursor: default; }
.sesiones-dia { display: grid; gap: 10px; }
.ses { border-radius: 18px; overflow: hidden; }
.ses > button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px 18px; }
.ses > button:focus-visible { outline: 2px solid var(--acento); outline-offset: -2px; }
.ses .hora { font: 700 15px var(--fuente-titulo); color: var(--acento); }
.ses .quien b { display: block; font-size: 15px; }
.ses .quien span { font-size: 13px; color: var(--texto-2); }
.ses .det { display: none; padding: 0 18px 16px 96px; font-size: 14px; line-height: 1.5; }
.ses.abierta .det { display: block; }
.ses .det p { margin: 0 0 10px; white-space: pre-line; }
.ses .det .decision { justify-content: flex-start; }
.ses.pleno .hora { color: #2c3e57; }
.chip { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--burbuja); color: var(--texto-2); white-space: nowrap; }
.chip.keylaw { background: #efe4fb; color: #7a00a3; } .chip.guardar { background: #e3edff; color: #1f55c4; } .chip.ejemplo { background: #fff1d9; color: #9a5a00; }
.como-funciona { margin-bottom: 12px; font-size: 14px; } .como-funciona p { margin: 4px 0 0; color: var(--texto-2); line-height: 1.5; }
@media (max-width: 640px) { .ses > button { grid-template-columns: 52px minmax(0, 1fr); } .ses > button .chip { display: none; } .ses .det { padding-left: 18px; } }
/* hemiciclo */
.hemiciclo svg { width: 100%; height: auto; display: block; }
.hemiciclo circle.curul { cursor: pointer; transition: r .15s; }
.hemiciclo circle.curul:hover, .hemiciclo circle.curul.elegida { stroke: #15212b; stroke-width: 2.5; }
.leyenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; }
.leyenda span { display: inline-flex; gap: 6px; align-items: center; }
.leyenda i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dip-cab { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
.dip-cab .foto { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 600 19px var(--fuente-titulo); flex: none; }
.dip-cab b { font: 700 17px/1.2 var(--fuente-titulo); display: block; }
.lista-simple { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; } .lista-simple li { margin-bottom: 4px; }
.cita { font-size: 13.5px; border-left: 3px solid var(--acento); padding: 2px 0 2px 10px; margin: 8px 0; color: var(--texto); }
.alerta { padding: 10px 12px; border-radius: 12px; background: #fff1d9; color: #7a4500; font-size: 13.5px; margin: 6px 0 10px; }

/* pestañas de coordinación (como las de KeyCurul) y Kiwi flotante */
.coordinaciones { display: inline-flex; justify-self: start; gap: 2px; padding: 4px; border-radius: 14px; background: var(--burbuja); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.coordinaciones button { all: unset; cursor: pointer; white-space: nowrap; font-size: 14px; font-weight: 600; padding: 9px 18px; border-radius: 10px; color: var(--texto-2); transition: color .2s, background .2s; }
.coordinaciones button[aria-selected="true"] { color: var(--texto); background: var(--vidrio-fuerte); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.coordinaciones button:focus-visible { outline: 2px solid var(--acento); }
.piso { grid-template-columns: minmax(0, 1fr) !important; }
.charla { position: fixed; right: 20px; bottom: 100px; width: min(400px, calc(100vw - 32px)); height: min(620px, calc(100vh - 140px)); z-index: 2600;
  contain: none; display: none; }
.charla.abierta { display: flex; animation: burbuja .3s var(--muelle); transform-origin: bottom right; }
.kiwi-boton { all: unset; cursor: pointer; position: fixed; right: 20px; bottom: 20px; z-index: 2600; width: 66px; height: 66px; border-radius: 50%;
  box-shadow: 0 8px 24px rgb(0 0 0 / .22), 0 0 0 3px #fff; transition: transform .15s var(--muelle); }
.kiwi-boton:hover { transform: scale(1.06); }
.kiwi-boton:focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; }
.kiwi-cara, .kiwi-cara svg { width: 100%; height: 100%; display: block; border-radius: 50%; overflow: hidden; }
.kiwi-estado { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; border-radius: 99px; display: none; }
.kiwi-estado.nuevo { display: block; background: #e5484d; box-shadow: 0 0 0 3px #fff; }
.kiwi-estado.pensando { display: flex; gap: 3px; align-items: center; justify-content: center; padding: 0 6px; background: #fff; box-shadow: 0 2px 8px rgb(0 0 0 / .2); }
.kiwi-estado.pensando i { width: 5px; height: 5px; border-radius: 50%; background: #5c6b75; animation: salto 1.1s ease-in-out infinite; }
.kiwi-estado.pensando i:nth-child(2) { animation-delay: .15s } .kiwi-estado.pensando i:nth-child(3) { animation-delay: .3s }
.kiwi-boton .burbujita { position: absolute; right: 74px; bottom: 18px; }
@media (max-width: 640px) { .charla { right: 8px; left: 8px; width: auto; bottom: 92px; } }

.caja { padding: 18px 20px; }
.fila { display: flex; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--borde); }
.fila:first-child { border-top: 0; }
.fila .que { flex: 1; min-width: 0; }
.fila .que b { display: block; font-weight: 600; font-size: 14.5px; }
.fila .que span { font-size: 12.5px; color: var(--texto-2); }
.etiqueta { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: #efe4fb; color: #7a00a3; flex: none; }
.etiqueta.vivo { background: #ffe3e6; color: #c21d33; }
.etiqueta.gaceta { background: #fff1d9; color: #9a5a00; }
.etiqueta.sesion { background: #e3edff; color: #1f55c4; }
.boton { all: unset; box-sizing: border-box; cursor: pointer; white-space: nowrap; font-size: 13.5px; font-weight: 600; padding: 7px 14px; border-radius: 99px;
  background: var(--burbuja); color: var(--texto); text-align: center; }
.boton:hover { box-shadow: inset 0 0 0 1px var(--acento); }
.boton:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
.boton.primario { background: var(--acento); color: var(--sobre-acento); }
.boton.elegido { background: #1fa35b; color: #fff; }
.boton[disabled] { opacity: .45; cursor: default; box-shadow: none; }
.vacio { color: var(--texto-2); font-size: 14px; margin: 6px 0; }
.chica { font-size: 12.5px; color: var(--texto-2); }

/* la mesa de un agente: panel lateral */
.cajon { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); z-index: 2000; background: var(--fondo); border-left: 1px solid var(--borde);
  box-shadow: -18px 0 50px rgb(0 0 0 / .18); display: flex; flex-direction: column; transform: translateX(104%); transition: transform .35s var(--muelle); }
.cajon.abierto { transform: none; }
.velo { position: fixed; inset: 0; z-index: 1999; background: rgb(10 20 30 / .25); opacity: 0; pointer-events: none; transition: opacity .25s; }
.velo.ver { opacity: 1; pointer-events: auto; }
.cajon-cab { display: flex; gap: 14px; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--borde); background: var(--vidrio-fuerte); }
.cajon-cab .mini { width: 56px; height: 56px; }
.cajon-cab h2 { font: 700 21px/1.15 var(--fuente-titulo); margin: 0; letter-spacing: -.015em; }
.cajon-cab p { margin: 2px 0 0; font-size: 13.5px; color: var(--texto-2); }
.cajon-cab .cerrar { all: unset; cursor: pointer; margin-left: auto; font-size: 26px; line-height: 1; padding: 4px 10px; border-radius: 99px; color: var(--texto-2); }
.cajon-cab .cerrar:hover { background: var(--burbuja); }
.cajon-cuerpo { flex: 1; overflow-y: auto; padding: 20px 22px 40px; display: grid; gap: 18px; align-content: start; }
.bloque { background: var(--vidrio-fuerte); border: 1px solid var(--borde); border-radius: 18px; padding: 16px 18px; }
.bloque > h3 { font: 700 16px/1.25 var(--fuente-titulo); margin: 0 0 2px; }
.bloque > p.chica { margin: 0 0 12px; }
.proceso { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--borde); border-radius: 16px; overflow: hidden; background: var(--vidrio-fuerte); }
.paso { padding: 10px 12px; border-right: 1px solid var(--borde); }
.paso:last-child { border-right: 0; }
.paso .q { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--acento); }
.paso.humano .q { color: #b26a00; }
.paso .n { font: 600 22px/1.15 var(--fuente-titulo); }
.paso .t { font-size: 12px; color: var(--texto-2); line-height: 1.3; }
@media (max-width: 640px) { .proceso { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.campo { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.campo input[type="text"], .campo input:not([type]) { flex: 1; min-width: 200px; font: 14px var(--fuente); color: var(--texto); background: var(--burbuja); border: 1px solid transparent; border-radius: 99px; padding: 8px 14px; }
.campo label { font-size: 13px; display: flex; gap: 6px; align-items: center; }

/* checklist de normas y de sesiones */
.check { display: grid; grid-template-columns: 22px 10px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--borde); }
.check:first-of-type { border-top: 0; }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--acento); }
.check .bola { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; }
.bola.alto { background: var(--alto); } .bola.medio { background: var(--medio); } .bola.bajo { background: var(--bajo); } .bola.ninguno { background: var(--ninguno); }
.check .t { font-weight: 600; font-size: 14px; }
.check .s { font-size: 12.5px; color: var(--texto-2); }
.check .leer { all: unset; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--acento); margin-top: 2px; display: inline-block; }
.check .lectura { display: none; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--burbuja); font-size: 13.5px; line-height: 1.5; }
.check.leyendo .lectura { display: block; }
.check .listo, .edicion-cab .listo { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #157346; background: #dff5e8; padding: 3px 8px; border-radius: 6px; }
.edicion-cab { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 4px; }
.edicion-cab b { font: 700 15px var(--fuente-titulo); }
.barra-accion { position: sticky; bottom: -40px; display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 14px; margin-top: 10px;
  border-radius: 14px; background: var(--vidrio-fuerte); border: 1px solid var(--borde); box-shadow: var(--sombra); }
.decision { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

/* reportes: Keylaw y Keymonitor */
.reporte { border: 1px solid var(--borde); border-radius: 16px; background: var(--vidrio-fuerte); overflow: hidden; }
.reporte + .reporte { margin-top: 10px; }
.reporte > button.cab { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; width: 100%; padding: 13px 16px; cursor: pointer; }
.reporte .asunto { font-weight: 600; font-size: 14.5px; }
.reporte .meta { font-size: 12.5px; color: var(--texto-2); margin-top: 2px; }
.chip-estado { align-self: start; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
.chip-estado.borrador { background: #fff1d9; color: #9a5a00; }
.chip-estado.revisado { background: #e3edff; color: #1f55c4; }
.chip-estado.enviado { background: #dff5e8; color: #157346; }
.reporte .cuerpo { display: none; padding: 0 16px 14px; }
.reporte.abierto .cuerpo { display: block; }
.reporte textarea { width: 100%; min-height: 360px; font: 14px/1.6 var(--fuente); color: var(--texto); background: var(--fondo); border: 1px solid var(--borde); border-radius: 12px; padding: 12px 14px; resize: vertical; }
.acciones { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.acciones .espacio { flex: 1; }
.aviso { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 3000; background: #15212b; color: #fff; padding: 10px 18px; border-radius: 99px;
  font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.aviso.ver { opacity: 1; }
.tarea { font-size: 12.5px; display: flex; gap: 8px; margin-top: 6px; }
.tarea .estado { font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; flex: none; padding-top: 2px; }
.estado.hecha { color: #1fa35b; } .estado.error { color: var(--alto); } .estado.pendiente, .estado.en { color: var(--medio); }
.busca-perfil { width: 100%; box-sizing: border-box; font: 14px var(--fuente); color: var(--texto); background: var(--burbuja); border: 1px solid transparent; border-radius: 99px; padding: 9px 16px; margin: 8px 0; }
.grupos-perfil { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.ejemplos-busqueda { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.ejemplos-busqueda .ejemplo { all: unset; cursor: pointer; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--burbuja); color: var(--texto-2); }
.ejemplos-busqueda .ejemplo:hover { color: var(--texto); }
.resultados-perfil { max-height: 52vh; overflow-y: auto; margin-top: 6px; }
.resultados-perfil .fila .boton { flex: none; }
.form-perfil { display: grid; gap: 8px; }
.form-perfil input, .form-perfil textarea { font: 14px var(--fuente); color: var(--texto); background: var(--burbuja); border: 1px solid transparent; border-radius: 12px; padding: 9px 14px; resize: vertical; }

.lista-perfiles .fila .boton { flex: none; }
.campo select { flex: 1; min-width: 200px; font: 14px var(--fuente); color: var(--texto); background: var(--burbuja); border: 1px solid transparent; border-radius: 99px; padding: 8px 14px; }
.cajon { transition: transform .35s var(--muelle), width .3s var(--muelle); }
.cajon.pantalla { width: 100vw; }
.cajon.pantalla .cajon-cuerpo { padding-inline: max(22px, calc((100vw - 1100px) / 2)); }
.cajon.pantalla .reporte textarea { min-height: 62vh; font-size: 15px; }
.sub-cab { display: flex; align-items: center; gap: 14px; }
.sub-cab h3 { margin: 0; font: 700 18px/1.2 var(--fuente-titulo); }
.sub-cab .volver { all: unset; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--texto-2); padding: 6px 12px; border-radius: 99px; background: var(--burbuja); }
.sub-cab .volver:hover { color: var(--texto); }
.menu-mesa { display: grid; gap: 10px; }
.menu-mesa .opcion { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 18px;
  background: var(--vidrio-fuerte); border: 1px solid var(--borde); transition: transform .15s, box-shadow .15s; }
.menu-mesa .opcion:hover { transform: translateY(-1px); box-shadow: var(--sombra); }
.menu-mesa .opcion:focus-visible { outline: 2px solid var(--acento); }
.menu-mesa .texto { flex: 1; display: grid; gap: 2px; }
.menu-mesa b { font: 600 16px/1.3 var(--fuente-titulo); }
.menu-mesa small { font-size: 13px; color: var(--texto-2); }
.menu-mesa .num { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 99px; background: var(--alto); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.menu-mesa .flecha { font-size: 24px; color: var(--texto-2); line-height: 1; }
.alerta.vivo { background: #ffe3e6; color: #a3162a; }
details.edicion { background: var(--vidrio-fuerte); border: 1px solid var(--borde); border-radius: 16px; padding: 4px 18px; }
details.edicion > summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; padding: 12px 0; list-style: none; }
details.edicion > summary::-webkit-details-marker { display: none; }
details.edicion > summary::before { content: "›"; display: inline-block; transition: transform .2s; color: var(--texto-2); }
details.edicion[open] > summary::before { transform: rotate(90deg); }
details.edicion > .acciones { margin-bottom: 6px; }
.lectura-larga h3 { margin: 0 0 8px; }
.texto-largo { white-space: pre-wrap; font-size: 15px; line-height: 1.7; margin-top: 14px; max-width: 80ch; }
/* la mesa de cada persona: ventana central grande (no panel lateral) */
.cajon { top: 50%; left: 50%; right: auto; bottom: auto; width: min(1180px, 94vw); height: min(90vh, 940px); border: 1px solid var(--borde); border-radius: 26px;
  overflow: hidden; box-shadow: 0 40px 120px rgb(10 20 30 / .35); transform: translate(-50%, -47%) scale(.97); opacity: 0; pointer-events: none;
  transition: transform .3s var(--muelle), opacity .2s; }
.cajon.abierto { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
.velo { background: rgb(10 20 30 / .45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.cajon-cab { padding: 20px 28px; }
.cajon-cuerpo { padding: 24px max(28px, calc((100% - 1000px) / 2)) 48px; }
@media (max-width: 700px) { .cajon { width: 100vw; height: 100dvh; border-radius: 0; } }
.menu-mesa { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; padding-top: 8px; }
.menu-mesa .opcion { position: relative; flex-direction: column; align-items: flex-start; gap: 16px; padding: 26px 26px 24px; min-height: 190px; border-radius: 22px; }
.menu-mesa .opcion:hover { transform: translateY(-3px); box-shadow: 0 18px 40px rgb(20 40 50 / .12); }
.menu-mesa .icono { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: #efe4fb; color: #7a00a3; }
.menu-mesa .texto { gap: 6px; }
.menu-mesa b { font-size: 18px; }
.menu-mesa small { font-size: 13.5px; line-height: 1.45; }
.menu-mesa .num { position: absolute; top: 20px; right: 20px; }
.editor-perfil { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 22px; align-items: start; }
.editor-perfil .vista-keyperfil { width: 100%; height: calc(90vh - 190px); border: 0; border-radius: 16px; background: #e7eaff; position: sticky; top: 0; }
.campo-perfil { display: grid; gap: 4px; }
.campo-perfil > span { font-size: 12.5px; font-weight: 600; color: var(--texto-2); }
.campo-perfil small { font-size: 11.5px; color: var(--texto-2); }
.form-perfil h3 { margin: 0 0 4px; font: 700 18px var(--fuente-titulo); }
@media (max-width: 900px) { .editor-perfil { grid-template-columns: 1fr; } }
.cajon-cuerpo.en-menu { align-content: center; }
.cajon-cuerpo.en-menu .menu-mesa { padding-bottom: 6vh; }
.kiwi-reviso { background: #f6efff; border-radius: 10px; padding: 8px 12px; margin: 0 0 10px; }
.kiwi-reviso summary { cursor: pointer; font-weight: 600; color: #6b2e9e; }
.corregido { box-shadow: inset 0 0 0 2px #b48cf0 !important; background: #f6efff !important; }
.perfil-cab { display: flex; gap: 16px; align-items: center; margin-bottom: 6px; }
.perfil-foto { position: relative; width: 84px; height: 84px; border-radius: 50%; overflow: hidden; flex: none; cursor: pointer; background: #e4e0fb;
  display: grid; place-items: center; font: 700 26px var(--fuente-titulo); color: #6552e6; box-shadow: 0 0 0 3px #fff, 0 4px 14px rgb(0 0 0 / .12); }
.perfil-foto img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; }
.perfil-foto i { position: absolute; inset: auto 0 0; padding: 4px 0 6px; font: 600 11px var(--fuente); font-style: normal; color: #fff; text-align: center; background: rgb(0 0 0 / .45); opacity: 0; transition: opacity .15s; }
.perfil-foto:hover i { opacity: 1; }
.barra-formato { display: flex; gap: 4px; }
.barra-formato .formato { all: unset; cursor: pointer; min-width: 30px; height: 28px; padding: 0 8px; box-sizing: border-box; border-radius: 8px; display: grid; place-items: center; font-size: 14px; color: var(--texto); background: var(--burbuja); }
.barra-formato .formato.texto { font-size: 12px; color: var(--texto-2); }
.barra-formato .formato:hover { background: #e6dcfb; }

.editor-texto p { margin: 0 0 12px; }
.editor-texto ul { margin: 0 0 12px; padding-left: 22px; }

.editor-reporte { display: grid; gap: 6px; }

.con-foto img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; }

function fotoChica(archivo) {
  // la foto se achica en el navegador (400 px, JPEG) antes de subirla
  return new Promise(function (ok, mal) {
    var lector = new FileReader();
    lector.onload = function () {
      var im = new Image();
      im.onload = function () {
        var lado = Math.min(400, Math.max(im.width, im.height)), z = lado / Math.max(im.width, im.height);
        var cv = document.createElement("canvas"); cv.width = Math.round(im.width * z); cv.height = Math.round(im.height * z);
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); ok(cv.toDataURL("image/jpeg", 0.85));
      };
      im.onerror = mal; im.src = lector.result;
    };
    lector.onerror = mal; lector.readAsDataURL(archivo);
  });
}

function gacetasDelDia() {

  var orden = { alto: 0, medio: 1, bajo: 2, ninguno: 3 };
  dia.forEach(function (g, i) {
    var ns = normasDe(g.id).slice().sort(function (x, y) { return orden[x.impacto] - orden[y.impacto]; });
    var d = el("details", "edicion"); estado.abiertas = estado.abiertas || {};

    sum.append(el("b", null, g.titulo.replace("Gaceta Oficial ", "Gaceta N.º ")), el("span", "chica", ns.length + (ns.length === 1 ? " norma" : " normas")));

    if (g.decision !== "revisada") boton(acc, "Marcar revisada", "", function () { marcarRevisada([g.id]).then(function () { g.decision = "revisada"; avisar("Edición revisada"); pintarTodo(); }); });
    d.append(acc);
    if (!ns.length) d.append(el("p", "vacio", "Todavía no se ha leído."));
    ns.forEach(function (n) { d.append(filaNorma(n)); });
    c.append(d);
  });
  var barra = el("div", "barra-accion");
  var n = Object.keys(estado.marcadas).length;
  barra.append(el("span", "chica cuenta-marcadas"));
  var pedir = boton(barra, "Generar Keymonitor", "primario", function () {
    var ids = Object.keys(estado.marcadas); if (!ids.length) return;
    pedir.disabled = true;
    var ediciones = {}; estado.normas.forEach(function (x) { if (estado.marcadas[x.id]) ediciones[x.gaceta] = 1; });
    postJSON("/oficina/tarea", { agente: "normativa", tipo: "keymonitor", ref: ids.join(","), detalle: ids.length + " normas elegidas en la oficina" }).then(function (r) {
      if (r.error) { avisar(r.error); pedir.disabled = false; return; }
      marcarRevisada(Object.keys(ediciones));
      estado.marcadas = {}; avisar("Se están escribiendo los Keymonitor"); cargar();
    });

}
function contarMarcadas() {

  if (t) t.textContent = n ? n + (n === 1 ? " norma marcada" : " normas marcadas") : "Marca las normas que necesitan Keymonitor";

function subSubir(c) {

  arch.onchange = function () { var m = (arch.files[0] && arch.files[0].name.match(/(\d{5})(?:[ _-]?([A-Za-z])\b)?/)); if (m && !num.value) num.value = m[1] + (m[2] ? "-" + m[2].toUpperCase() : ""); };
  var acc = el("div", "acciones"), env = el("button", "boton primario", "Subir"); env.type = "submit"; acc.append(env);

function filaNorma(n) {

/* ---------------------------------------------------------------- Kiwi: el único chat de la oficina */
var mensajes = $("mensajes"), historial = [];
try { historial = JSON.parse(sessionStorage.getItem("kiwi-panama") || "[]") || []; } catch (e) { historial = []; }
historial = historial.filter(function (m) { return m.rol !== "nota"; });
function guardarChat() { try { sessionStorage.setItem("kiwi-panama", JSON.stringify(historial.slice(-40))); } catch (e) {} }
$("mini-jefe").innerHTML = retrato(JEFE);
["¿Qué pasó esta semana en la Asamblea?", "¿Qué salió en la Gaceta sobre construcción?", "¿Quién preside la Comisión de Trabajo?", "¿Qué dijo Javier Sucre sobre los jubilados?"]
  .forEach(function (q) { var b = el("button", null, q); b.type = "button"; b.onclick = function () { preguntar(q); }; $("sugerencias").append(b); });
function pintarMensajes(pensando) {
  mensajes.replaceChildren();
  $("sugerencias").hidden = historial.some(function (m) { return m.rol === "yo"; });
  if (!historial.length) mensajes.append(el("div", "msj jefe-dice", "Hola. Pregúntame por un proyecto, una sesión, una norma de la Gaceta o un actor."));
  historial.forEach(function (m) {
    if (m.rol === "nota") { mensajes.append(el("div", "nota", m.texto)); return; }
    var burbuja = el("div", "msj " + (m.rol === "yo" ? "yo-digo" : "jefe-dice") + (m.error ? " error" : ""), m.texto);
    if (m.fichas && m.fichas.length) {
      var ops = el("div", "opciones");
      m.fichas.slice(0, 5).forEach(function (n) {
        var b = el("button"); b.type = "button"; b.append(el("b", null, "Ficha " + n), document.createTextNode("PDF del proyecto"));
        b.onclick = function () { window.open("https://sistemas.asamblea.gob.pa/segLegis/Documents/" + n + ".pdf", "_blank", "noopener"); };
        ops.append(b);
      });
      burbuja.append(ops);
    }
    mensajes.append(burbuja);
  });
  if (pensando) { var p = el("div", "msj jefe-dice pensando"); p.setAttribute("aria-label", "Kiwi está pensando"); p.append(el("i"), el("i"), el("i")); mensajes.append(p); }
  mensajes.scrollTop = mensajes.scrollHeight;
}
$("borrar-chat").addEventListener("click", function () { if (ocupado) return; historial = []; guardarChat(); pintarMensajes(); });
function nota(t) { historial.push({ rol: "nota", texto: t }); pintarMensajes(true); }
function estadoJefe(t) { $("estado-jefe").textContent = t; }
function abrirChat() {
  $("charla").classList.add("abierta"); $("kiwi-boton").setAttribute("aria-expanded", "true"); estado.kiwiNuevo = false; estadoBurbuja();
  pintarMensajes(ocupado); setTimeout(function () { $("pregunta").focus(); }, 150);
}
function cerrarChat() { $("charla").classList.remove("abierta"); $("kiwi-boton").setAttribute("aria-expanded", "false"); estadoBurbuja(); }
$("kiwi-cara").innerHTML = retrato(JEFE);
$("kiwi-boton").onclick = function () { if ($("charla").classList.contains("abierta")) cerrarChat(); else abrirChat(); };
$("cerrar-chat").onclick = cerrarChat;
function estadoBurbuja() {
  var e = $("kiwi-estado"), abierta = $("charla").classList.contains("abierta");
  e.className = "kiwi-estado" + (ocupado && !abierta ? " pensando" : estado.kiwiNuevo && !abierta ? " nuevo" : "");
  e.replaceChildren(); if (ocupado && !abierta) e.append(el("i"), el("i"), el("i"));
}
var ocupado = false;
function preguntar(q) {
  if (ocupado || !q.trim()) return; ocupado = true;
  var botonEnviar = document.querySelector("#formulario button"); botonEnviar.disabled = true;
  var previo = historial.filter(function (m) { return (m.rol === "yo" || m.rol === "kiwi") && !m.error; })

  historial.push({ rol: "yo", texto: q }); pintarMensajes(true); estadoJefe("Buscando en la oficina…"); estadoBurbuja();
  postJSON("/oficina/kiwi", { mensaje: q, historial: previo }).catch(function () { return { error: "Se cortó la conexión. Vuelve a intentarlo." }; })
    .then(function (d) {
      historial.push(d.error ? { rol: "kiwi", texto: d.error, error: true } : { rol: "kiwi", texto: d.respuesta, fichas: d.fichas || [] });

$("formulario").addEventListener("submit", function (e) {

// cada 30 s: estado de la Mac, tareas, decisiones y reportes nuevos (no se recarga mientras alguien edita un correo)
// Todo se recarga cada 30 s (Andrés, 2026-10-26: mejor al día aunque se agote lo gratis de D1; pasa al plan pagado).

setInterval(function () { if (!document.hidden && !estado.editando) recargar(); }, 30000);

})();
