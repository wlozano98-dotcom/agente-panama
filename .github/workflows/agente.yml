name: Agente Panamá

on:
  schedule:
    - cron: "17 * * * *" # cada hora, al minuto 17 (hora UTC)
  workflow_dispatch: # botón "Run workflow" para correrlo a mano

permissions:
  contents: write # para guardar estado.json

concurrency:
  group: agente-panama
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar rclone (para Google Drive)
        run: |
          curl -sL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o rclone.zip
          unzip -q rclone.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/

      - name: Revisar la Asamblea y analizar
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python agente.py

      # La Cronista (prensa.py): noticias y agenda de comisiones de www.asamblea.gob.pa, que tiene anti-bots y solo
      # abre con un navegador. Si falla, no frena el resto (el estado se guarda igual).
      - name: Cache del navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1

      - name: Leer noticias y agenda de la Asamblea
        continue-on-error: true
        timeout-minutes: 15
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium-headless-shell || python -m playwright install --with-deps chromium
          python prensa.py

      - name: Guardar estado
        if: always()
        run: |
          if [ -n "$(git status --porcelain estado.json)" ]; then
            git config user.name "agente-panama"
            git config user.email "agente-panama@users.noreply.github.com"
            git add estado.json
            git commit -m "Actualizar estado"
            git pull --rebase
            git push
          fi
